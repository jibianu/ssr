name: oil-and-gas-club

services:
  course-backend:
    image: course-backend
    container_name: course-backend
    user: app
    working_dir: /app
    entrypoint: ["dotnet", "Courses.Serverless.dll"]
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - DOTNET_RUNNING_IN_CONTAINER=true
      - ASPNETCORE_HTTP_PORTS=8080
      - APP_UID=1654

  course-frontend:
    image: course-frontend-test
    container_name: course-frontend-test
    restart: unless-stopped
    ports:
      - "4008:4000"