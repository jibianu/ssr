<!-- ✅ PERFORMANCE: Use async pipe with Observable for automatic change detection and subscription cleanup -->
<!-- ✅ HYDRATION: trackBy uses unique IDs to prevent hydration mismatches in SSR -->
<ngb-toast *ngFor="let toast of toasts$ | async; trackBy: trackByToastIndex" 
  [header]="toast.headertext || toast.header" 
  [class]="toast.classname"
  [autohide]="toast.autohide" 
  [delay]="toast.delay || 5000" 
  (hide)="toastService.remove(toast)">
  <ng-template [ngIf]="isTemplate(toast)" [ngIfElse]="text">
    <ng-template [ngTemplateOutlet]="toast.textOrTpl"></ng-template>
  </ng-template>

  <ng-template #text>{{ toast.textOrTpl }}</ng-template>
</ngb-toast>
