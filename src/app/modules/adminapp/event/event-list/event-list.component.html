<div class="d-sm-flex align-items-center justify-content-between mb-4">
  <h1 class="h3 mb-0 text-gray-800">Event List</h1>
  <a class="d-none d-sm-inline-block btn btn-primary shadow-sm" [routerLink]="['/app/event/add']">
    <i class="fa fa-plus fa-sm text-white-50"></i> Add Event
  </a>
</div>

<div class="form-group pull-right">
  <input type="text" class="search form-control" placeholder="Search" name="search" [(ngModel)]="term">
</div>

<table class="table">
  <thead>
    <tr>
      <th scope="col" style="width:30%">
        Title
        <i (click)="onSortClick($event, 'title')" class="fa fa-caret-up"></i>
      </th>
      <th scope="col" style="width:30%">Event Date</th>
      <th scope="col" style="width:30%">Action</th>
    </tr>
  </thead>
  <tbody>
    <!-- ✅ use filterBy instead of filter -->
    <tr *ngFor="let item of categories | filterBy: term : ['title','startDate','endDate'] | paginate: config">
      <td>{{item.title}}</td>
      <td>{{item.startDate | date:'dd-MM-yy'}} - {{item.endDate | date:'dd-MM-yy'}}</td>
      <td>
        <button type="button" class="btn btn-success" [routerLink]="['/app/event/edit',item.id]">
          <i class="fa fa-edit"></i>
        </button>
        <button type="button" class="btn btn-danger ml-1" (click)="deleteEvent(item.id)">
          <i class="fa fa-trash"></i>
        </button>
        <button type="button" class="btn btn-primary ml-1" [routerLink]="['/app/event/users',item.id]">
          <i class="fa fa-user"></i>
        </button>
        <button type="button" *ngIf="item.registrationCompleted"
                class="btn btn-dark ml-1"
                [routerLink]="['/app/event/edit',item.id,'new']">
          <i class="fa fa-refresh"></i>
        </button>
      </td>
    </tr>
  </tbody>
</table>

<div class="d-flex bd-highlight mb-3">
  <pagination-controls (pageChange)="pageChanged($event)"></pagination-controls>
  <div class="ml-auto p-2 bd-highlight">
    <select (change)="onTableSizeChange($event)" class="custom-select">
      <option *ngFor="let size of tableSizes" [ngValue]="size">
        {{ size }}
      </option>
    </select>
  </div>
</div>
