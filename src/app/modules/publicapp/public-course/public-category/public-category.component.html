  <div class="py-4 py-lg-6 bg-black">
    <div class="container">
      <div class="row">
        <div class="col-lg-12 col-md-12 col-12">
          <div>
            <h1 class="text-white mb-1 header-text">{{categoryName}} Courses</h1>
          </div>
        </div>
      </div>
    </div>
  </div>
  
  <div class="container">
    <div class="row d-flex justify-content-center align-items-center">
      <div class="col-md-12">
        <!-- Blog Post -->
        <div class="row">
          <div class="col-md-6 mt-5 d-flex" *ngFor="let item of courses | paginate: config">
            <div class="blog-grid w-100">
              <!-- Blog Image -->
              <div class="blog-img">
                <a [href]="item?.canonicalUrl">
                  <img class="card-img-top" [src]="item?.titleImageUrl" (error)="onImgError($event)" alt="{{item?.title}}" />
                </a>
              </div>
  
              <!-- Blog Info -->
              <div class="blog-info flex-fill">
                <h5>
                  <a [href]="item?.canonicalUrl">{{ item?.title }}</a>
                </h5>
                <p class="price-tag">Price: {{ item.amount | currency:"INR":"symbol" }}</p>
  
                <!-- Course Features -->
                <span class="text-ellipse">
                  <p *ngFor="let feature of item?.courseFeatures">{{feature?.description}}</p>
                </span>
  
                <!-- Buttons and Teacher Info -->
                <div class="d-sm-flex align-items-center justify-content-between">
                  <div class="btn-bar">
                    <a class="px-btn-arrow" [href]="item?.canonicalUrl">
                      <span>Read More</span>
                      <i class="arrow"></i>
                    </a>
                  </div>
                  <div class="btn-bar" *ngIf="item?.courseTeachers?.length">
                    <img [src]="item?.courseTeachers[0]?.imageUrl" (error)="onImgError($event)"
                      class="img-fluid avatar avatar-ex-sm rounded-pill mr-2 shadow" alt="" />
                    <small><strong>{{item?.courseTeachers[0]?.name}}</strong></small>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
  
        <!-- ✅ Correct Pagination Controls -->
        <div class="custom-page-controls">
          <pagination-controls
            (pageChange)="pageChange($event)"
            previousLabel="&larr; Older"
            nextLabel="Newer &rarr;"
            class="justify-content-center mt-5 mb-4"
          ></pagination-controls>
        </div>
      </div>
    </div>
  </div>
