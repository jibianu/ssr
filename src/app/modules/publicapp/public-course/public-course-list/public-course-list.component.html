<!-- ✅ SSR OPTIMIZATION: Use async pipe - no blocking, automatic unsubscribe -->
<ng-container *ngIf="coursesData$ | async as data">
  <div class="container">
    <div class="row">
      <div 
        class="col-lg-3 col-md-6 col-12 mt-4 d-flex" 
        *ngFor="let item of data.courses | paginate: data.config; trackBy: trackByCourseId"
      >
        <div class="blog-grid d-flex flex-column h-100 w-100 shadow rounded">
          
          <div class="blog-img">
            <a [href]="item?.canonicalUrl">
              <img 
                class="card-img-top img-fluid"
                [src]="item?.titleImageUrl" 
                (error)="onImgError($event)" 
                alt="{{ item?.title }}" 
                loading="lazy"
                width="300"
                height="200"
                style="aspect-ratio: 3/2; object-fit: cover;"
              />
            </a>
          </div>

        
          <div class="blog-info flex-fill d-flex flex-column p-3">
            <h5 class="mb-2">
              <a [href]="item?.canonicalUrl" class="text-dark">{{ item?.title }}</a>
            </h5>
            <h6 class="card-subtitle mb-3 text-muted">
              Designed by oilandgasclub's expert instructors
            </h6>

            <ul class="blog-toc__list p-0 flex-grow-1">
              <li 
                *ngFor="let it of item?.courseFeatures; trackBy: trackByFeatureId" 
                class="mt-1 list-unstyled"
              >
                <div class="block-list-item d-flex align-items-center">
                  <img [src]="it?.iconUrl" height="20" width="20" loading="lazy" alt="Feature icon">
                  <span class="ml-2">{{ it?.description }}</span>
                </div>
              </li>
            </ul>

          
            <div class="buy mt-auto pt-3">
              <div class="price font-weight-bold text-success mb-2">
                Price: {{ item.amount | currency:"INR":"symbol" }}
              </div>
              <a 
                [href]="item?.canonicalUrl" 
                class="btn btn-enroll btn-primary w-100"
              >
                <i class="fa fa-shopping-cart"></i> Enroll Now
              </a>
            </div>
          </div>
        </div>
      </div>
    </div>

    
    <pagination-template 
      #api="paginationApi" 
      class="custom-page-controls" 
      (pageChange)="pageChange($event)"
    >
      <ul class="pagination justify-content-center mt-5 mb-4">
        <li class="page-item" [class.disabled]="api.isFirstPage()">
          <a href="javascript:void(0)" (click)="api.previous()" class="page-link">
            &larr; Older
          </a>
        </li>
        <li class="page-item" [class.disabled]="api.isLastPage()">
          <a href="javascript:void(0)" (click)="api.next()" class="page-link">
            Newer &rarr;
          </a>
        </li>
      </ul>
    </pagination-template>

    <pagination-controls 
      (pageChange)="pageChange($event)" 
      class="pagination justify-content-center mt-5 mb-4"
    >
    </pagination-controls>
  </div>
</ng-container>
