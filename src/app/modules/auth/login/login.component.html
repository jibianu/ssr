<div class="auth-page">
  <div class="auth-container">
    <!-- Header with Logo -->
    <header class="auth-header">
      <div class="brand-section">
        <img 
          [src]="logoUrl" 
          alt="Oilandgas Club logo" 
          class="brand-logo"
          (error)="$event.target.src='assets/s3/oilandgas_club.svg'"
        />
        <span class="brand-pipe" aria-hidden="true">|</span>
        <span class="brand-page">course</span>
      </div>
    </header>

    <!-- Guest Blogging Promotional Box -->
    <div class="promo-box">
      <h3 class="promo-title">Grow Your Industry Presence with OilAndGasClub Courses.</h3>
      <p class="promo-description">
        Create impactful courses. Publish them on OilAndGasClub's course platform. 
        Build your authority and reach professionals who matter.
      </p>
    </div>

    <!-- Login Form Card -->
    <main class="auth-card" role="main">
      <form class="auth-form" [formGroup]="loginForm" (ngSubmit)="onSubmit()">
        <div class="form-group">
          <label for="email">Email address</label>
          <input
            id="email"
            type="email"
            formControlName="username"
            class="input"
            [class.is-invalid]="submitted && f.username.errors"
            placeholder="Enter your email"
            autocomplete="email"
          />
          <div *ngIf="submitted && f.username.errors" class="field-error">
            <span *ngIf="f.username.errors.required">Email is required</span>
          </div>
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input
            id="password"
            type="password"
            formControlName="password"
            class="input"
            [class.is-invalid]="submitted && f.password.errors"
            placeholder="Enter your password"
            autocomplete="current-password"
          />
          <div *ngIf="submitted && f.password.errors" class="field-error">
            <span *ngIf="f.password.errors.required">Password is required</span>
          </div>
        </div>

        <button type="submit" class="btn-signin" [disabled]="loading">
          <span *ngIf="loading" class="spinner" aria-hidden="true"></span>
          <span>{{ loading ? 'Signing in...' : 'Sign in' }}</span>
        </button>

        <div *ngIf="error" class="alert-error" role="alert">{{ error }}</div>
      </form>
    </main>

  </div>
</div>
