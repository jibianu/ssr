<header id="theme-header" class="theme-header inner-header course-page-header">
  <div class="public-container">
    <div class="topbar-inner">
      <div class="logo" routerLink="/">
        <span>
          <img src="assets/s3/oilandgas_club.svg" width="120" height="54" alt="Oilandgasclub logo">
        </span>
      </div>

      <nav class="topbar-nav topbar-nav--desktop">
        <ul class="nav-menu">
          <li class="menu-item">
            <a [routerLink]="'/courses'">Courses</a>
          </li>
          <li class="menu-item">
            <a [routerLink]="'/events'">Events</a>
          </li>
          <li class="menu-item">
            <a href="https://elearn.oilandgasclub.com/auth/login/">Login</a>
          </li>
        </ul>
      </nav>

      <button class="mobile-nav" (click)="toggleVisibility()" type="button" aria-label="Open navigation">
        <span></span>
        <span></span>
        <span></span>
      </button>
    </div>

    <nav class="topbar-nav topbar-nav--mobile" *ngIf="isVisible">
      <div class="topbar-nav__header">
        <p>Browse Oilandgasclub</p>
        <button type="button" class="close" (click)="toggleinVisibility($event)" aria-label="Close navigation">
          ✕
        </button>
      </div>
      <ul class="nav-menu">
        <li class="menu-item">
          <a [routerLink]="'/courses'" (click)="toggleinVisibility()">Courses</a>
        </li>
        <li class="menu-item">
          <a [routerLink]="'/events'" (click)="toggleinVisibility()">Events</a>
        </li>
        <li class="menu-item">
          <a href="https://elearn.oilandgasclub.com/auth/login/" (click)="toggleinVisibility()">Login</a>
        </li>
      </ul>
    </nav>
  </div>
</header>
