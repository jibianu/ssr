# =============================================================================
# Nginx production config — oilandgasclub.com (Angular 20 SSR + .NET 8 API)
#
#   Node SSR container (dist/site/server/server.mjs)  → 127.0.0.1:4000
#   .NET API (Elearn.Serverless)                      → 127.0.0.1:52287
#
# SEO rules enforced here:
#   1. Canonical host = https://oilandgasclub.com (non-www — matches
#      environment.seoUrl, the sitemap and Stripe PublicSiteUrl).
#      http:// and www. 301 to it.
#   2. Legacy subdomains elearn.oilandgasclub.com / blog.oilandgasclub.com
#      301 to the main domain (content now lives there). This removes the
#      "Server Error (5xx)" GSC reports for those hosts.
#      If a subdomain is retired with no replacement content, switch the
#      marked line to `return 410;` instead.
#   3. Optional 410 map for permanently deleted pages (Google drops 410s
#      faster than 404s and stops recrawling them).
#
# WRONG pattern (breaks SSR + per-page meta — do not use):
#   root /var/www/site/browser;
#   location / { try_files $uri $uri/ /index.html; }
# =============================================================================

upstream oilandgasclub_ssr {
  server 127.0.0.1:4000;
  keepalive 32;
}

upstream oilandgasclub_api {
  server 127.0.0.1:52287;
  keepalive 8;
}

# --- Permanently removed pages → 410 Gone (edit as GSC reports old URLs) ---
map $uri $gone_page {
  default                0;
  ~^/wp-content/         1;
  ~^/wp-admin/           1;
  ~^/wp-includes/        1;
  ~^/xmlrpc\.php         1;
  # "/some-deleted-page"  1;
}

# --- 1) Plain HTTP (any host) → canonical https ---
# The rewrite strips a trailing slash in the SAME redirect (query string is
# appended automatically), so http://www…/affiliate-program/ needs exactly ONE
# hop to https://oilandgasclub.com/affiliate-program — never a redirect chain.
server {
  listen 80;
  listen [::]:80;
  server_name oilandgasclub.com www.oilandgasclub.com elearn.oilandgasclub.com blog.oilandgasclub.com www.blog.oilandgasclub.com;
  rewrite ^/(.*?)/+$ https://oilandgasclub.com/$1 permanent;
  return 301 https://oilandgasclub.com$request_uri;
}

# --- 2) www → non-www (canonical host), trailing slash stripped in one hop ---
server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name www.oilandgasclub.com;

  # ssl_certificate     /etc/letsencrypt/live/oilandgasclub.com/fullchain.pem;
  # ssl_certificate_key /etc/letsencrypt/live/oilandgasclub.com/privkey.pem;

  rewrite ^/(.*?)/+$ https://oilandgasclub.com/$1 permanent;
  return 301 https://oilandgasclub.com$request_uri;
}

# --- 3) Legacy elearn subdomain → apex (preserve path) ---
server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name elearn.oilandgasclub.com;

  # ssl_certificate     /etc/letsencrypt/live/oilandgasclub.com/fullchain.pem;
  # ssl_certificate_key /etc/letsencrypt/live/oilandgasclub.com/privkey.pem;

  rewrite ^/(.*?)/+$ https://oilandgasclub.com/$1 permanent;
  return 301 https://oilandgasclub.com$request_uri;
}

# --- 3a) Legacy blog hosts → apex article/hub (never 200 / never 502) ---
# Blog root → /blog hub. Article paths → matching apex slug (lowercase via Express
# if the request reaches Node; nginx preserves path in one hop).
server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name blog.oilandgasclub.com www.blog.oilandgasclub.com;

  # ssl_certificate     /etc/letsencrypt/live/oilandgasclub.com/fullchain.pem;
  # ssl_certificate_key /etc/letsencrypt/live/oilandgasclub.com/privkey.pem;

  location = / {
    return 301 https://oilandgasclub.com/blog;
  }
  rewrite ^/(.*?)/+$ https://oilandgasclub.com/$1 permanent;
  return 301 https://oilandgasclub.com$request_uri;
}

# --- 3b) Company tenant portals ({sub}.oilandgasclub.com, e.g. anu.oilandgasclub.com) ---
# Private applications (company login + dashboards). They keep working for
# company users, but every response is noindex and the Express layer answers
# robots.txt with "Disallow: /" — never indexed as duplicates of the main site.
# Needs a wildcard certificate (*.oilandgasclub.com).
# IMPORTANT: www.oilandgasclub.com must NOT fall through here — it has its own
# server block above. Keep that block deployed or www will soft-200 as a "tenant".
server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name ~^(?<tenant>(?!www$)[a-z0-9-]+)\.oilandgasclub\.com$;

  # ssl_certificate     /etc/letsencrypt/live/oilandgasclub.com/fullchain.pem;
  # ssl_certificate_key /etc/letsencrypt/live/oilandgasclub.com/privkey.pem;

  add_header X-Robots-Tag "noindex, nofollow" always;

  location /api/ {
    proxy_pass http://oilandgasclub_api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    add_header X-Robots-Tag "noindex, nofollow" always;
  }

  location / {
    proxy_pass http://oilandgasclub_ssr;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 120s;
    proxy_buffering on;
    proxy_next_upstream error timeout;
    error_page 502 504 =503 @ssr_unavailable;
  }

  location @ssr_unavailable {
    default_type text/plain;
    add_header Retry-After 10 always;
    return 503 "Service temporarily unavailable. Please retry.";
  }
}

# --- 4) Main site ---
server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name oilandgasclub.com;

  # ssl_certificate     /etc/letsencrypt/live/oilandgasclub.com/fullchain.pem;
  # ssl_certificate_key /etc/letsencrypt/live/oilandgasclub.com/privkey.pem;

  # Permanently deleted pages: 410 Gone (never 5xx). See map $gone_page above.
  if ($gone_page) {
    return 410;
  }

  # Trailing-slash policy: canonical URLs have NO trailing slash.
  # /worlds-largest-refineries/ → 301 /worlds-largest-refineries (one hop,
  # query preserved). Root "/" is not matched. The Express server applies the
  # same rule, so this also works when nginx is bypassed.
  rewrite ^/(.*?)/+$ /$1 permanent;

  # API: never crawled/indexed; robots.txt also disallows /api/.
  location /api/ {
    proxy_pass http://oilandgasclub_api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    add_header X-Robots-Tag "noindex, nofollow" always;
  }

  # Entire public site + Elearn shells: dist/site/server/server.mjs handles
  # SSR, robots meta, canonical, 404/410 statuses and X-Robots-Tag headers.
  location / {
    proxy_pass http://oilandgasclub_ssr;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 120s;
    proxy_buffering on;
    # Debug SSR vs CSR shell: curl -sI https://oilandgasclub.com/some-slug | grep -i x-ogc-ssr
    proxy_pass_header X-OGC-SSR;

    # If Node is down, serve 503 (retry signal) — never a raw 502 HTML dump.
    proxy_next_upstream error timeout;
    error_page 502 504 =503 @ssr_unavailable;
  }

  location @ssr_unavailable {
    default_type text/plain;
    add_header Retry-After 10 always;
    return 503 "Service temporarily unavailable. Please retry.";
  }
}
