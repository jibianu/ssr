# Example: Nginx in front of the Docker SSR container (Node on port 4000).
# Copy/rename as needed. THIS is what fixes empty <app-root> and missing og: meta in View Source.
#
# Wrong pattern (CSR shell only — no SSR, no per-page meta):
#   root /var/www/site/browser;
#   location / { try_files $uri $uri/ /index.html; }
#
# Right pattern: proxy ALL site HTML to Node; Node serves browser assets + SSR.

upstream oilandgasclub_ssr {
  server 127.0.0.1:4000;
  keepalive 32;
}

# Optional: API on same host
upstream oilandgasclub_api {
  server 127.0.0.1:52287;
  keepalive 8;
}

server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name www.oilandgasclub.com oilandgasclub.com;

  # ssl_certificate ...;
  # ssl_certificate_key ...;

  # If you terminate TLS here, Node sees HTTP — forwarded proto must be set.
  location /api/ {
    proxy_pass http://oilandgasclub_api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  # Entire public site + Elearn static mounts: handled by dist/site/server/server.mjs
  location / {
    proxy_pass http://oilandgasclub_ssr;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 120s;
    proxy_buffering on;
    # Debug SSR vs CSR shell (set by Express): curl -sI https://www.../some-slug | grep -i x-ogc-ssr
    proxy_pass_header X-OGC-SSR;
  }
}
