<div class="student-layout">
  <aside class="student-layout__sidebar">
    <div class="student-layout__sidebar-inner">
      <div class="student-layout__logo">
        <img class="student-layout__logo-icon" [src]="logoIconUrl" alt="Logo" width="32" height="32" (error)="onLogoIconError($event)" />
        <img class="student-layout__logo-full" [src]="logoUrl" alt="Logo" (error)="onLogoError($event)" />
      </div>
      <nav class="student-layout__nav">
        <a routerLink="/app/student/dashboard" routerLinkActive="active" title="Dashboard">
          <i class="fa fa-tachometer"></i>
          <span class="student-layout__nav-text">Dashboard</span>
        </a>
        <a routerLink="/app/student/courses" routerLinkActive="active" title="My Courses">
          <i class="fa fa-book"></i>
          <span class="student-layout__nav-text">My Courses</span>
        </a>
        <div class="student-layout__sub-nav">
          <a routerLink="/app/student/courses" [queryParams]="{ filter: 'in-progress' }" class="student-layout__sub-link" title="In Progress">
            <i class="fa fa-play"></i>
            <span class="student-layout__nav-text">In Progress</span>
          </a>
          <a routerLink="/app/student/courses" [queryParams]="{ filter: 'completed' }" class="student-layout__sub-link" title="Completed">
            <i class="fa fa-check-circle"></i>
            <span class="student-layout__nav-text">Completed</span>
          </a>
          <a routerLink="/app/student/courses" [queryParams]="{ filter: 'wishlisted' }" class="student-layout__sub-link" title="Wishlisted">
            <i class="fa fa-heart"></i>
            <span class="student-layout__nav-text">Wishlisted</span>
          </a>
        </div>
        <a routerLink="/app/student/categories" [class.active]="isExploreActive()" title="Explore">
          <i class="fa fa-compass"></i>
          <span class="student-layout__nav-text">Explore</span>
        </a>
        <a routerLink="/app/student/profile" routerLinkActive="active" title="Profile">
          <i class="fa fa-user-circle"></i>
          <span class="student-layout__nav-text">Profile</span>
        </a>
        <a routerLink="/app/student/certificate" routerLinkActive="active" title="Certificates">
          <i class="fa fa-certificate"></i>
          <span class="student-layout__nav-text">Certificates</span>
        </a>
        <a routerLink="/app/student/purchase-history" routerLinkActive="active" title="Purchase History">
          <i class="fa fa-shopping-cart"></i>
          <span class="student-layout__nav-text">Purchase History</span>
        </a>
        <a routerLink="/app/student/notifications" routerLinkActive="active" title="Notifications">
          <i class="fa fa-bell"></i>
          <span class="student-layout__nav-text">Notifications</span>
        </a>
      </nav>
      <div class="student-layout__user">
        <a routerLink="/app/student/profile" routerLinkActive="active" class="student-layout__user-link" title="Profile">
          <div class="student-layout__avatar">
            <img *ngIf="profileImageUrl && !sidebarAvatarError" [src]="profileImageUrl" alt="Profile" (error)="sidebarAvatarError = true">
            <span *ngIf="!profileImageUrl || sidebarAvatarError" class="student-layout__avatar-initial">{{ userInitial }}</span>
          </div>
          <span class="student-layout__nav-text student-layout__user-name">Profile</span>
        </a>
      </div>
    </div>
  </aside>

  <nav class="student-layout__mobile-bar">
    <a routerLink="/app/student/courses"><i class="fa fa-book"></i></a>
    <a routerLink="/app/student/categories"><i class="fa fa-compass"></i></a>
    <a routerLink="/app/student/profile"><i class="fa fa-user-circle"></i></a>
    <a routerLink="/app/student/certificate"><i class="fa fa-certificate"></i></a>
  </nav>

  <main class="student-layout__main">
    <header class="student-layout__topbar">
      <app-common-topbar></app-common-topbar>
    </header>
    <div class="student-layout__content student-layout__content--projected">
      <ng-content></ng-content>
    </div>
  </main>
</div>
