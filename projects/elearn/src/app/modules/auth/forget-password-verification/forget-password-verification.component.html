<div class="login-page">
  <div class="login-card">
    <header class="login-header">
      <a routerLink="/" class="login-brand" aria-label="oilandgasclub home">
        <img [src]="logoUrl" alt="oilandgasclub" class="login-brand__logo" width="130" height="42" fetchpriority="high">
      </a>
      <p class="login-header__prompt">
        Already have an account? <a [routerLink]="['/login']" class="login-header__link">Log in</a>
      </p>
    </header>

    <div class="login-info-box">
      <h1 class="login-info-box__title">Verify your reset code</h1>
      <p class="login-info-box__text">Enter the code we sent to your email, then set your new password.</p>
    </div>

    <form class="login-form" (ngSubmit)="forgetConfirm()" aria-label="Verify reset code and set password">
      <div class="login-form__field">
        <label class="login-form__label" for="fg-verify-code">Verification code</label>
        <input id="fg-verify-code" type="text" name="confirmationCode" [(ngModel)]="confirmationCode" required
          placeholder="Enter your code" class="login-form__input" autocomplete="one-time-code" inputmode="numeric"
          (keyup)="checklength()" maxlength="6">
      </div>
      <div class="login-form__field">
        <label class="login-form__label" for="fg-new-password">New password</label>
        <input id="fg-new-password" type="password" name="password" [(ngModel)]="password" required
          [disabled]="enable" minlength="8" maxlength="20" placeholder="New password" class="login-form__input" autocomplete="new-password">
      </div>
      <div class="login-form__field">
        <label class="login-form__label" for="fg-confirm-password">Confirm new password</label>
        <input id="fg-confirm-password" type="password" name="confirmPassword" [(ngModel)]="confirmPassword" required
          [disabled]="enable" minlength="8" maxlength="20" placeholder="Confirm new password" class="login-form__input" autocomplete="new-password">
        <span class="login-form__hint">The password must be 8–20 characters and must not contain spaces.</span>
      </div>

      <button type="submit" class="login-form__submit" [disabled]="enable">Change password</button>
    </form>

    <p class="login-signup">
      <a [routerLink]="['/login']" class="login-signup__link">Back to Log in</a>
    </p>
  </div>

  <footer class="login-footer">
    <p class="login-footer__copy">©2026 oilandgasclub, Edutech. All Rights Reserved.</p>
    <div class="login-footer__links">
      <a href="https://www.oilandgasclub.com/privacy-policy/" target="_blank" rel="noopener" class="login-footer__link">Privacy Policy</a>
      <a href="https://www.oilandgasclub.com/cookies/" target="_blank" rel="noopener" class="login-footer__link">Manage Cookies</a>
    </div>
  </footer>
</div>
