<div class="parent">
  <div class="child">
    <img ngSrc="assets/img/ogclubsvg.svg" alt="Logo" width="180" height="60" priority class="image">
    <div class="content">
      <h3>Change Password</h3>
    </div>
    <form>
      <div class="content">
        <div class="form-group mt-4">
          <!-- <label for="inputPasswordOld">New Password</label> -->
          <input type="password" class="form-control" [(ngModel)]="password" id="inputPasswordOld" required="" placeholder="New Password">
        </div>
        <div class="form-group mt-3">
          <!-- <label for="inputPasswordNew">Enter New Password Again</label> -->
          <input type="password" class="form-control" [(ngModel)]="confirmPassword" id="inputPasswordNew" required="" placeholder="Enter New Password Again">
          <span class="form-text small text-muted">
            The password must be 8-20 characters, and must <em>not</em> contain spaces.
          </span>
        </div>
        <div class="form-group mt-2">
          <button type="button" class="btn customBtn" (click)="changePassword()">Chnage
            Password</button>
        </div>
      </div>

    </form>
  </div>
</div>
