<div class="login-page">
  <div class="login-card">
    <header class="login-header">
      <a routerLink="/" class="login-brand" aria-label="oilandgasclub home">
        <img [src]="logoUrl" alt="oilandgasclub" class="login-brand__logo" width="130" height="42" fetchpriority="high">
      </a>
      <p class="login-header__prompt">
        Already have an account? <a [routerLink]="['/login']" class="login-header__link">Log in</a>
      </p>
    </header>

    <div class="login-info-box">
      <h1 class="login-info-box__title">Forgot password?</h1>
      <p class="login-info-box__text">Don’t worry, resetting your password is easy. Enter your email address and we’ll send you a reset code.</p>
    </div>

    <form class="login-form" (ngSubmit)="forget()" aria-label="Reset password">
      <div class="login-form__field">
        <label class="login-form__label" for="forgot-email">Email address</label>
        <input id="forgot-email" type="email" name="email" [(ngModel)]="email" required
          placeholder="you@example.com" class="login-form__input" autocomplete="email" inputmode="email">
      </div>

      <p *ngIf="errorMessage" class="login-form__error" role="alert">{{ errorMessage }}</p>
      <button type="submit" class="login-form__submit" [disabled]="submitting">
        {{ submitting ? 'Sending…' : 'Send reset code' }}
      </button>
    </form>

    <p class="login-signup">
      Don’t have an account yet? <a [routerLink]="['/register']" class="login-signup__link">Sign up</a>
    </p>
  </div>

  <footer class="login-footer">
    <p class="login-footer__copy">©2026 oilandgasclub, Edutech. All Rights Reserved.</p>
    <div class="login-footer__links">
      <a href="https://oilandgasclub.com/privacy-policy" target="_blank" rel="noopener" class="login-footer__link">Privacy Policy</a>
      <a href="https://oilandgasclub.com/cookies" target="_blank" rel="noopener" class="login-footer__link">Manage Cookies</a>
    </div>
  </footer>
</div>
