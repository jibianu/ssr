<div class="user-unavailable">
  <div class="user-unavailable__card">
    <h1 class="user-unavailable__title">Account unavailable</h1>
    <p class="user-unavailable__message">{{ message }}</p>
    <button type="button" class="user-unavailable__btn" (click)="logout()">
      Log out
    </button>
  </div>
</div>
