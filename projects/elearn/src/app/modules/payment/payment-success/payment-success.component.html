<div class="payment-success-page">
  <div class="payment-success-card">
    <div class="payment-success__icon-wrap">
      <i class="fa fa-check-circle payment-success__icon"></i>
    </div>
    <h1 class="payment-success__title">Payment Successful</h1>
    <p class="payment-success__message">{{ entityType === 'event' ? 'Thank you. Your event registration was successful.' : 'Thank you for your purchase. Your payment was processed successfully and your course is now active.' }}</p>

    <div class="payment-success__actions">
      <a *ngIf="entityId && entityType === 'event'" [routerLink]="['/app/student/events/event', entityId]" class="payment-success__btn payment-success__btn--primary">
        <i class="fa fa-calendar-alt"></i> View event
      </a>
      <a *ngIf="entityId && entityType !== 'event'" [routerLink]="['/app/student/details/curriculum-list', entityId]" class="payment-success__btn payment-success__btn--primary">
        <i class="fa fa-play"></i> Start Learning
      </a>
      <a routerLink="/app/student/courses" class="payment-success__btn payment-success__btn--secondary">
        <i class="fa fa-book"></i> Browse Courses
      </a>
    </div>

    <p class="payment-success__footer">© oilandgasclub. All rights reserved.</p>
  </div>
</div>
