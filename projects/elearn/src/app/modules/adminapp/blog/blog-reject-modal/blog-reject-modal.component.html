<div class="modal-header">
  <h5 class="modal-title">Reject Blog</h5>
  <button type="button" class="btn-close" aria-label="Close" (click)="cancel()"></button>
</div>
<div class="modal-body">
  <label class="form-label">Reason for rejection (shown to the trainer)</label>
  <textarea class="form-control" [(ngModel)]="rejectionReason" rows="4" placeholder="e.g. Improve SEO description"></textarea>
  <small class="form-text text-muted">The trainer can edit the blog and resubmit for review.</small>
</div>
<div class="modal-footer">
  <button type="button" class="btn btn-outline-secondary" (click)="cancel()">Cancel</button>
  <button type="button" class="btn btn-danger" (click)="reject()"><i class="fa fa-times"></i> Reject</button>
</div>
