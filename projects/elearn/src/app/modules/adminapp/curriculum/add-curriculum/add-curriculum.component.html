<div class="add-curriculum-modal">
  <div class="add-curriculum-modal__header curriculum-navbar-header" *ngIf="activeModal">
    <h4 class="add-curriculum-modal__title">{{pageTitle}}</h4>
    <button type="button" class="close add-curriculum-modal__close" aria-label="Close" (click)="goBack()">
      <span aria-hidden="true">&times;</span>
    </button>
  </div>
  <div class="add-curriculum-modal__body">
  <div class="d-flex align-items-center justify-content-center mb-2 heading" *ngIf="!activeModal">
    <h2>{{pageTitle}}</h2>
  </div>

  <div class="row">
    <div class="col-md-12 customDesign" *ngIf="curriculumForm">
      <form [formGroup]="curriculumForm" (ngSubmit)="onSubmit()">
        <div class="form-group">
          <label>Title</label>
          <input type="text" formControlName="title" class="form-control"
            [ngClass]="{ 'is-invalid': submitted && f.title.errors }" />
          <div *ngIf="submitted && f.title.errors" class="invalid-feedback">
            <div *ngIf="f.title.errors.required">Title is required</div>
          </div>
        </div>

        <div class="form-group">
          <label>Description</label>
          <textarea type="text" formControlName="description" class="form-control"
            [ngClass]="{ 'is-invalid': submitted && f.description.errors }"></textarea>
          <div *ngIf="submitted && f.description.errors" class="invalid-feedback">
            <div *ngIf="f.description.errors.required">Description is required</div>
          </div>
        </div>

        <div class="form-group d-flex" *ngIf="!activeModal">
          <button class="btn btn-outline-add" type="submit">{{btntext}}</button>
          <button type="button" class="btn btn-outline-add ml-2" (click)="goBack()">Cancel</button>
        </div>
      </form>
    </div>
  </div>
  </div>
  <div class="add-curriculum-modal__footer" *ngIf="activeModal">
    <button class="btn btn-primary" type="button" (click)="onSubmit()">{{btntext}}</button>
    <button type="button" class="btn btn-outline-secondary ml-2" (click)="goBack()">Cancel</button>
  </div>
</div>
