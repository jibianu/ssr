<div class="card-header">
    <h4 class="mb-0">Topics</h4>
</div>
<div class="card-body">
    <ul class="list-group list-group-flush">
        <!-- List group item -->
        <li class="list-group-item px-0 py-3" *ngFor="let item of topics; index as i;">
            <div class="d-flex justify-content-between">
                <div class="d-flex">
                    <div>
                        <h5 class="mb-0">{{item?.title}}</h5>
                        <p class="mb-0 font-size-xs">{{item?.createdOn | date: short}}</p>
                    </div>
                </div>
                <div>
                    <span class="dropdown">
                        <a class="text-muted text-decoration-none" href="#!" role="button" id="paymentDropdown"
                            data-toggle="dropdown" aria-haspopup="true" aria-expanded="false">
                            <i class="fa fa-ellipsis-v"></i>
                        </a>
                        <span class="dropdown-menu dropdown-menu-right" aria-labelledby="paymentDropdown" style="">
                            <a class="dropdown-item" href="javascript:void(0)" (click)="updateTopic(content,item)"><i
                                    class="fa fa-edit dropdown-item-icon"></i> Edit</a>
                            <a class="dropdown-item" href="javascript:void(0)" (click)="deleteTopic(item.id)"><i
                                    class="fa fa-trash dropdown-item-icon"></i> Delete</a>
                        </span>
                    </span>
                </div>
            </div>
        </li>
        <hr>
    </ul>
    
    <a class="btn btn-outline-primary mt-4" (click)="AddTopic(content)">Add Topic</a>
</div>

<ng-template #content let-modal>
    <form [formGroup]="topicForm" (ngSubmit)="onSubmit()">
        <div class="modal-header curriculum-navbar-header">
            <h4 class="modal-title">{{pageTitle}}</h4>
            <button type="button" class="close" aria-label="Close" (click)="modal.dismiss('Cross click')">
                <span aria-hidden="true">&times;</span>
            </button>
        </div>
        <div class="modal-body">

            <div class="form-group">
                <label>Title</label>
                <input type="text" formControlName="title" class="form-control"
                    [ngClass]="{ 'is-invalid': submitted && f.title.errors }" />
                <div *ngIf="submitted && f.title.errors" class="invalid-feedback">
                    <div *ngIf="f.title.errors.required">Title is required</div>
                </div>
            </div>

        </div>
        <div class="modal-footer">
            <div class="form-group">
                <button class="btn btn-primary" type="submit">{{btntext}}</button>
                <button type="button" class="btn btn-danger ml-1" (click)="modal.close('Close click')">Cancel</button>
            </div>

        </div>
    </form>
</ng-template>
