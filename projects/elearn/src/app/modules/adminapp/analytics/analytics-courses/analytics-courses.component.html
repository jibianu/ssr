<div class="dashboard">
  <div class="dashboard__header">
    <h1 class="dashboard__title">Course Analytics</h1>
    <div class="dashboard__filter">
      <a routerLink="/app/admin/analytics" class="dashboard__preset">Students</a>
      <a routerLink="/app/admin/analytics/drop-off" class="dashboard__preset">Drop-off report</a>
      <div class="dashboard__presets">
        <button type="button" class="dashboard__preset" [class.dashboard__preset--active]="dateRangePreset === 'today'" (click)="onPresetChange('today')">Today</button>
        <button type="button" class="dashboard__preset" [class.dashboard__preset--active]="dateRangePreset === 'last7'" (click)="onPresetChange('last7')">Last 7 Days</button>
        <button type="button" class="dashboard__preset" [class.dashboard__preset--active]="dateRangePreset === 'last30'" (click)="onPresetChange('last30')">Last 30 Days</button>
        <button type="button" class="dashboard__preset" [class.dashboard__preset--active]="dateRangePreset === 'thisMonth'" (click)="onPresetChange('thisMonth')">This Month</button>
        <button type="button" class="dashboard__preset" [class.dashboard__preset--active]="dateRangePreset === 'custom'" (click)="setDateRangeFromPreset('custom')">Custom Range</button>
      </div>
      <div class="dashboard__custom" *ngIf="dateRangePreset === 'custom'">
        <input type="date" class="dashboard__date" [(ngModel)]="customFrom" />
        <span class="dashboard__date-sep">–</span>
        <input type="date" class="dashboard__date" [(ngModel)]="customTo" />
        <button type="button" class="dashboard__apply" (click)="applyCustomRange()">Apply</button>
      </div>
    </div>
  </div>

  <div class="dashboard__table-section">
    <div class="dashboard__table-wrap" [class.dashboard__table-wrap--loading]="loading">
      <table class="dashboard__table">
        <thead>
          <tr>
            <th class="dashboard__th">Course</th>
            <th class="dashboard__th">Enrollments</th>
            <th class="dashboard__th">Completions</th>
            <th class="dashboard__th">Events (range)</th>
            <th class="dashboard__th"></th>
          </tr>
        </thead>
        <tbody>
          <tr *ngIf="loading">
            <td colspan="5" class="dashboard__empty-cell">Loading…</td>
          </tr>
          <tr *ngIf="!loading && !courses?.length">
            <td colspan="5" class="dashboard__empty-cell">No courses in this range.</td>
          </tr>
          <tr *ngFor="let row of courses; trackBy: trackByCourseId">
            <td class="dashboard__td">{{ row.courseName }}</td>
            <td class="dashboard__td">{{ row.enrollmentCount }}</td>
            <td class="dashboard__td">{{ row.completionCount }}</td>
            <td class="dashboard__td">{{ row.eventCountInRange }}</td>
            <td class="dashboard__td">
              <a [routerLink]="['/app/admin/analytics/drop-off']" [queryParams]="{ courseId: row.courseId }" class="dashboard__link">Drop-off</a>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
