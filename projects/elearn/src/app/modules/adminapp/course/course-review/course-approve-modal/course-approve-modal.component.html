<div class="modal-header">
  <h5 class="modal-title">Approve Course</h5>
  <button type="button" class="btn-close" aria-label="Close" (click)="cancel()"></button>
</div>
<div class="modal-body">
  <label class="form-label">Approval note / message (optional, shown in review history)</label>
  <textarea class="form-control" [(ngModel)]="approvalNote" rows="4" placeholder="e.g. Looks good. Ready for publish."></textarea>
  <small class="form-text text-muted">This message is saved in the review history for the trainer and admin.</small>
</div>
<div class="modal-footer">
  <button type="button" class="btn btn-outline-secondary" (click)="cancel()">Cancel</button>
  <button type="button" class="btn btn-success" (click)="approve()"><i class="fa fa-check"></i> Approve</button>
</div>
