<div class="ufd">
  <div class="modal-header">
    <h4 class="modal-title">{{ mode === 'create' ? 'Add user' : 'Edit user' }}</h4>
    <button type="button" class="btn-close" aria-label="Close" (click)="activeModal.dismiss()"></button>
  </div>
  <div class="modal-body">
    <div *ngIf="loading" class="text-muted">Loading…</div>
    <form *ngIf="!loading" [formGroup]="form" (ngSubmit)="save()">
      <div class="row g-2">
        <div class="col-md-6">
          <label class="form-label">First name</label>
          <input class="form-control" formControlName="firstName" />
        </div>
        <div class="col-md-6">
          <label class="form-label">Last name</label>
          <input class="form-control" formControlName="lastName" />
        </div>
        <div class="col-12">
          <label class="form-label">Email</label>
          <input class="form-control" type="email" formControlName="email" autocomplete="email" />
        </div>
        <div class="col-md-6">
          <label class="form-label">Phone</label>
          <input class="form-control" formControlName="phone" />
        </div>
        <div class="col-md-6">
          <label class="form-label">Department</label>
          <input class="form-control" formControlName="department" />
        </div>
        <div class="col-md-6">
          <label class="form-label">Designation</label>
          <input class="form-control" formControlName="designation" />
        </div>
        <div class="col-md-6">
          <label class="form-label">Employee ID</label>
          <input class="form-control" formControlName="employeeCode" />
        </div>
        <div class="col-md-6">
          <label class="form-label">Role</label>
          <select class="form-select" formControlName="roleId">
            <option [ngValue]="studentRoleId">Student</option>
          </select>
        </div>
        <div class="col-md-6 d-flex align-items-end" *ngIf="!ssoInviteMode">
          <label class="form-check mb-0">
            <input class="form-check-input" type="checkbox" formControlName="isActive" />
            <span class="form-check-label">Active</span>
          </label>
        </div>
        <div class="col-12" *ngIf="ssoInviteMode">
          <p class="text-muted small mb-0">This employee will use corporate SSO. No password or OTP is sent. They activate when they first sign in with your identity provider.</p>
        </div>
        <div class="col-12" *ngIf="!ssoInviteMode">
          <label class="form-label">{{ mode === 'create' ? 'Password' : 'New password (optional)' }}</label>
          <input class="form-control" type="password" formControlName="password" autocomplete="new-password" />
        </div>
      </div>
    </form>
  </div>
  <div class="modal-footer">
    <button type="button" class="btn btn-secondary" (click)="activeModal.dismiss()">Cancel</button>
    <button type="button" class="btn btn-primary" [disabled]="saving" (click)="save()">{{ saving ? 'Saving…' : 'Save' }}</button>
  </div>
</div>
