<div class="mt-13 course-container">
    <div class="container-fluid">
      <div class="row justify-content-center">
        <div class="col-10">
          <div class="content h-100">
            <div class="d-flex align-items-center justify-content-between mb-4">
              <div class="w-100">
                <h3 class="mb-5 text-truncate-line-2">{{HighlightRow + 1 + ')'}} {{selectedQuestion?.title}} </h3>
                <div *ngIf="selectedQuestion && selectedQuestion?.options && selectedQuestion?.options?.length > 1">
                  <div *ngFor="let item of selectedQuestion.options; let j= index;" class="card-options ck-content post-body"
                    (click)="selectOption(j)" [class.active]="j == selectedAnswer" [class.disableCard]="isSubmit"
                    [class.correct]="isSubmit && selectedQuestion.options[j].isCorrect == true"
                    [class.wrong]="isSubmit && selectedQuestion.options[j].isCorrect == false && j == selectedAnswer" [innerHTML]="item?.description">
                  </div>
                </div>
  
                <div class="justify-content-between description" *ngIf="isSubmit || (selectedQuestion && selectedQuestion.options && selectedQuestion.options.length)  === 1">
                  <strong>Solution</strong>
                  <div class="mt-2 mb-5 ck-content post-body" [innerHTML]="selectedQuestion?.description">
                  </div>
                </div>
  
                <div class="d-flex justify-content-between p-2">
                  <button class="btn btn-secondary" (click)="previous(HighlightRow)">
                    Previous
                  </button>
                  <button class="btn btn-primary" (click)="next(HighlightRow)" *ngIf="selectedAnswer == null && (selectedQuestion && selectedQuestion.options && selectedQuestion.options.length)  > 1">
                    Skip
                  </button>
                  <button class="btn btn-primary" (click)="submit()" *ngIf="selectedAnswer != null && !isSubmit">
                    Submit
                  </button>
                  <button class="btn btn-primary" (click)="next(HighlightRow)" *ngIf="isSubmit || (selectedQuestion && selectedQuestion.options && selectedQuestion.options.length) === 1">
                    Next
                  </button>
                  <!-- <button class="btn btn-primary" (click)="goToCurriculumDetails()" *ngIf="isSubmit || (selectedQuestion && selectedQuestion.options && selectedQuestion.options.length)  === 1">
                    Finish
                  </button> -->
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
  
  <div class="card course-sidebar" id="courseAccordion">
    <ul class="list-group list-group-flush course-list" *ngIf="questions">
      <li class="list-group-item" *ngFor="let item of questions; index as i">
        <a class="mb-2 d-flex justify-content-between align-items-center text-decoration-none text-inherit"
          href="javascript:void(0)" (click)="ClickedRow(i)" [class.active]="i == HighlightRow">
          <span>{{i + 1 + ')'}} {{item?.title}}</span>
        </a>
      </li>
    </ul>
  </div>
