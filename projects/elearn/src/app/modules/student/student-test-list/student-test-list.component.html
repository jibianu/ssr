<div class="card mb-4" >
               
    <div class="card-header">
        <h3 class="mb-0">Tests</h3>
    </div>
    
    <div class="card-body">
        <ul class="list-group list-group-flush">
            
            <li class="list-group-item px-0 py-3" *ngFor="let item of questionsSetList; index as i;">
                <div class="d-flex">
                    <div class="align-self-center mr-auto">
                        <h5 class="mb-0"><a [routerLink]="['/app/student/details/test-details', item.id]">{{item?.title}}</a></h5>
                        <p class="mb-0 font-size-xs">{{Difficulty[item?.difficultyLevelId]}} {{item?.questionSetTestInformation?.questionCount}}Qs</p>
                    </div>
                </div>
            </li>
            <hr>
        </ul>
    </div>
</div>
