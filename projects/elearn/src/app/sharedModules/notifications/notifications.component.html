<div class="notifications-page">
  <header class="notifications-page__header">
    <h1 class="notifications-page__title">Notifications</h1>
    <div class="notifications-page__actions">
      <button
        type="button"
        class="notifications-page__mark-all"
        *ngIf="unreadCount > 0 && !loading"
        (click)="markAllAsRead()">
        Mark all as read
      </button>
      <button
        type="button"
        class="notifications-page__clear-all"
        *ngIf="items.length > 0 && !loading"
        (click)="clearAllHistory()">
        Remove all history
      </button>
    </div>
  </header>

  <div class="notifications-page__list" [class.notifications-page__list--loading]="loading">
    <ng-container *ngIf="loading">
      <div class="notifications-page__skeleton" *ngFor="let i of [1,2,3,4,5]"></div>
    </ng-container>
    <p *ngIf="!loading && items.length === 0" class="notifications-page__empty">No notifications yet.</p>
    <div
      *ngFor="let item of items"
      class="notifications-page__item"
      [class.notifications-page__item--unread]="!item.isRead"
      [class.notifications-page__item--has-link]="item.linkUrl"
      (click)="goToNotification(item)">
      <span class="notifications-page__item-title">{{ item.title }}</span>
      <span class="notifications-page__item-message">{{ item.message }}</span>
      <span *ngIf="item.linkUrl" class="notifications-page__item-link">View link &rarr;</span>
      <span class="notifications-page__item-date">{{ item.createdOn | date:'medium' }}</span>
    </div>
  </div>

  <app-common-pagination
    *ngIf="!loading && items.length > 0"
    class="notifications-page__pagination"
    [pageNumber]="page"
    [pageSize]="pageSize"
    [totalCount]="totalCount"
    [pageSizeOptions]="pageSizeOptions"
    (pageChange)="onPageChange($event)"
    (pageSizeChange)="onPageSizeChange($event)">
  </app-common-pagination>
</div>
