<div class="sm-study-tab" *ngIf="loading">
  <div class="sm-study-tab__skeleton"></div>
</div>

<p class="text-danger" *ngIf="loadError && !loading">{{ loadError }}</p>

<app-study-material-reader
  *ngIf="!loading && !loadError"
  [groups]="studyMaterials"
  [allowDownload]="false"
  [studentView]="true"
></app-study-material-reader>
