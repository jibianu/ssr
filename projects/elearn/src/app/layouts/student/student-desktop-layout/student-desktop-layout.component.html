<div class="student-layout">
  <!-- Desktop sidebar -->
  <aside class="student-layout__sidebar">
    <div class="student-layout__sidebar-inner">
    <div class="student-layout__logo">
      <img class="student-layout__logo-icon" [src]="logoIconUrl" alt="Logo" width="32" height="32" (error)="onLogoIconError($event)" />
      <img class="student-layout__logo-full" [src]="logoUrl" alt="Logo" (error)="onLogoError($event)" />
    </div>
    <nav class="student-layout__nav">
      <a routerLink="dashboard" routerLinkActive="active" title="Dashboard">
        <i class="fa fa-tachometer"></i>
        <span class="student-layout__nav-text">Dashboard</span>
      </a>
      <a routerLink="courses" [class.active]="isMyCoursesActive()" title="My Courses">
        <i class="fa fa-book"></i>
        <span class="student-layout__nav-text">My Courses</span>
      </a>
      <div class="student-layout__sub-nav">
        <a routerLink="courses" [class.active]="isCourseFilter(1) && isOnCoursesRoute()" (click)="setCourseFilter(1)" class="student-layout__sub-link" title="In Progress">
          <i class="fa fa-play"></i>
          <span class="student-layout__nav-text">In Progress</span>
        </a>
        <a routerLink="courses" [class.active]="isCourseFilter(2) && isOnCoursesRoute()" (click)="setCourseFilter(2)" class="student-layout__sub-link" title="Completed">
          <i class="fa fa-check-circle"></i>
          <span class="student-layout__nav-text">Completed</span>
        </a>
        <a routerLink="courses" [class.active]="isCourseFilter(3) && isOnCoursesRoute()" (click)="setCourseFilter(3)" class="student-layout__sub-link" title="Wishlisted">
          <i class="fa fa-heart"></i>
          <span class="student-layout__nav-text">Wishlisted</span>
        </a>
      </div>
      <a routerLink="categories" routerLinkActive="active" title="Explore">
        <i class="fa fa-compass"></i>
        <span class="student-layout__nav-text">Explore</span>
      </a>
      <a routerLink="events" routerLinkActive="active" title="Events">
        <i class="fa fa-calendar-check-o"></i>
        <span class="student-layout__nav-text">Events</span>
      </a>
      <a routerLink="profile" routerLinkActive="active" title="Profile">
        <i class="fa fa-user-circle"></i>
        <span class="student-layout__nav-text">Profile</span>
      </a>
      <a routerLink="certificate" routerLinkActive="active" title="Certificates">
        <i class="fa fa-certificate"></i>
        <span class="student-layout__nav-text">Certificates</span>
      </a>
    </nav>
    <nav class="student-layout__nav-bottom" aria-label="Account shortcuts">
      <a routerLink="purchase-history" routerLinkActive="active" title="Purchase History">
        <i class="fa fa-shopping-cart"></i>
        <span class="student-layout__nav-text">Purchase History</span>
      </a>
      <a routerLink="notifications" routerLinkActive="active" title="Notifications">
        <i class="fa fa-bell"></i>
        <span class="student-layout__nav-text">Notifications</span>
      </a>
    </nav>
    <div class="student-layout__sidebar-footer">
      <app-student-sidebar-membership-cta></app-student-sidebar-membership-cta>
      <div class="student-layout__user">
      <a routerLink="profile" routerLinkActive="active" class="student-layout__user-link" title="Profile">
        <div class="student-layout__avatar">
          <img
            *ngIf="profileImageUrl && !sidebarAvatarError"
            [src]="profileImageUrl"
            alt="Profile"
            (error)="sidebarAvatarError = true"
          >
          <span *ngIf="!profileImageUrl || sidebarAvatarError" class="student-layout__avatar-initial">{{ userInitial }}</span>
        </div>
        <span class="student-layout__nav-text student-layout__user-name">Profile</span>
      </a>
    </div>
    </div>
    </div>
  </aside>

  <!-- Desktop only: no mobile bar in this layout (mobile uses separate mobile-layout) -->
  <main class="student-layout__main">
    <header class="student-layout__topbar" *ngIf="!(playerState.focusMode$ | async)">
      <app-common-topbar></app-common-topbar>
    </header>
    <div class="student-layout__content" [class.student-layout__content--player]="playerState.focusMode$ | async">
      <ng-content></ng-content>
    </div>
  </main>
</div>
