<div class="modal-header">
  <h5 class="modal-title">Remove from Management</h5>
  <button type="button" class="close" (click)="close()">&times;</button>
</div>
<div class="modal-body">
  <p class="mb-2" *ngIf="trainerName">Trainer: <strong>{{ trainerName }}</strong></p>
  <p class="mb-2 text-muted">Select a management user to remove this trainer from:</p>
  <ul class="list-group">
    <li class="list-group-item d-flex justify-content-between align-items-center" *ngFor="let m of managementList">
      <span>{{ m.parentUserName || m.parentUserId || m.ParentUserName || m.ParentUserId }}</span>
      <button class="btn btn-sm btn-outline-danger" (click)="remove(m)" [disabled]="removing">
        <span *ngIf="removingMappingId !== (m.id || m.Id)">Remove</span>
        <span *ngIf="removingMappingId === (m.id || m.Id)"><i class="fa fa-spinner fa-spin"></i></span>
      </button>
    </li>
  </ul>
  <p *ngIf="!managementList?.length" class="text-muted mt-2">No management mappings found.</p>
</div>
<div class="modal-footer">
  <button type="button" class="btn btn-secondary" (click)="close()">Close</button>
</div>
