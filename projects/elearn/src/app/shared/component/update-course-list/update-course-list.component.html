<div class="modal-header">
    <h4 class="modal-title">Edit Course</h4>
    <button type="button" class="close" aria-label="Close" (click)="closeModal('ok')">
        <span aria-hidden="true">&times;</span>
    </button>
  </div>
  <div class="modal-body">
  <div>
    <!--Course section Start -->
  
    <strong>{{Category}}</strong>
    <div class="form-check" *ngFor="let item of CourseList">
      <input class="form-check-input" type="checkbox" value="" id="flexCheckDefault" checked="true">
      <label class="form-check-label" for="flexCheckDefault">
        {{item.title}}
      </label>
    </div>
  
  
    <!--Course section Ends -->
  
  </div>
  
  </div>
  <div class="modal-footer">
      <!-- <button type="button" class="btn btn-outline-dark" >Close</button>-->
      <button type="button" class="btn btn-danger" (click)="closeModal('ok')">Cancel</button> 
      <button type="button" class="btn btn-success" (click)="updateStudent()">Submit</button> 
  </div>
