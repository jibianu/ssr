<div class="modal-header">
  <h4 class="modal-title">Edit Permissions</h4>
  <button type="button" class="close" aria-label="Close" (click)="closeModal()">
      <span aria-hidden="true">&times;</span>
  </button>
</div>
<div class="modal-body">
  <div class="dropdown permisn-drp">
      <button class="btn btn-primary dropdown-toggle" type="button" id="dropdownMenuButton" data-toggle="dropdown" aria-haspopup="true" aria-expanded="false">
        {{selectedRole}}
      </button>
      <div class="dropdown-menu" aria-labelledby="dropdownMenuButton">
        <span class="dropdown-item" *ngFor="let item of rolesList" [ngClass]="{'disabled': item.id !== userRoleId }">{{item.name}}</span>
      </div>
    </div>
    <strong>Permissions</strong>
    <div class="form-check" *ngFor="let item of permissionList">
      <input class="form-check-input" type="checkbox" [id]="'perm-' + item.id" [checked]="item.IsChecked"
        [(ngModel)]="item.IsChecked">
      <label class="form-check-label" [for]="'perm-' + item.id">
        {{item.name}}
      </label>
    </div>
</div>
<div class="modal-footer">
  <button type="button" class="btn btn-danger" (click)="closeModal()">Cancel</button>
  <button type="button" class="btn btn-success" (click)="updateStudent()">Submit</button>
</div>
