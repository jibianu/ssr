<header class="common-topbar">
  <div class="common-topbar__left">
    <button *ngIf="showSidebarToggler" type="button" class="common-topbar__toggler" (click)="onSidebarTogglerClick()" aria-label="Toggle menu">
      <i class="fa fa-bars"></i>
    </button>
    <a href="#" class="common-topbar__logo-link" aria-label="Go to home" (click)="$event.preventDefault(); goHome()">
      <img [src]="logoUrl" alt="Logo" class="common-topbar__logo" (error)="onLogoError($event)">
    </a>
    <button *ngIf="showBack" type="button" class="common-topbar__back" (click)="goBack()" aria-label="Go back">
      <i class="fa fa-arrow-left"></i>
    </button>
  </div>
  <h1 class="common-topbar__title" *ngIf="displayTitle">{{ displayTitle }}</h1>
  <div class="common-topbar__curriculum-wrap" *ngIf="showCurriculumToolbar">
    <nav class="common-topbar__curriculum-tabs" role="tablist">
      <button type="button" class="common-topbar__curriculum-tab" [class.common-topbar__curriculum-tab--active]="curriculumActiveTab === 'concepts'" (click)="onCurriculumTabClick('concepts')">CURRICULUM</button>
      <button type="button" class="common-topbar__curriculum-tab" [class.common-topbar__curriculum-tab--active]="curriculumActiveTab === 'questionset'" (click)="onCurriculumTabClick('questionset')">TEST INFORMATION</button>
    </nav>
    <div class="common-topbar__curriculum-actions">
    <input type="text" class="common-topbar__search" placeholder="Search curriculum..." [ngModel]="curriculumSearchTerm" (ngModelChange)="onCurriculumSearchChange($event)" />
    <button type="button" class="common-topbar__action-btn common-topbar__action-btn--landing" (click)="onCurriculumLandingPanelClick()" title="Edit landing page"><i class="fa fa-globe"></i> Landing page</button>
    <button *ngIf="showCourseReviewButton" type="button" class="common-topbar__action-btn common-topbar__action-btn--outline" (click)="onCurriculumReviewPanelClick()" title="Open review panel"><i class="fa fa-clipboard"></i> Review</button>
    <button *ngIf="showCurriculumEditActions" type="button" class="common-topbar__action-btn common-topbar__action-btn--outline" (click)="onCurriculumEditPriceClick()" title="Edit price"><i class="fa fa-pencil"></i> Edit price</button>
    <button *ngIf="showCurriculumEditActions" type="button" class="common-topbar__action-btn common-topbar__action-btn--primary" (click)="onCurriculumAddCurriculumClick()"><i class="fa fa-plus"></i> Add Curriculum</button>
    </div>
  </div>
  <div class="common-topbar__right">
    <div class="common-topbar__student-search" *ngIf="showStudentCourseSearch" #studentSearchContainer>
      <span class="common-topbar__student-search__icon" aria-hidden="true">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      </span>
      <input
        type="text"
        class="common-topbar__student-search__input"
        [ngModel]="studentSearchText"
        (input)="onStudentSearchInput($event)"
        (focus)="onStudentSearchFocus()"
        placeholder="Search courses"
        aria-label="Search courses"
        autocomplete="off"
      />
      <div
        class="common-topbar__student-search__dropdown"
        *ngIf="studentSearchDropdown && (studentSearchResults.length > 0 || studentSearchLoading)"
        role="listbox"
      >
        <div *ngIf="studentSearchLoading" class="common-topbar__student-search__loading">Searching...</div>
        <button
          *ngFor="let course of studentSearchResults"
          type="button"
          class="common-topbar__student-search__item"
          (click)="onStudentSelectCourse(course)"
          role="option"
        >
          {{ course.title | fixMojibake }}
        </button>
      </div>
    </div>
    <div class="common-topbar__actions" *ngIf="showAddCategoryButton || showUserMappingButton || showCourseListToolbar || showTrainerListToolbar || showTrainerDashboardToolbar || showBlogListToolbar || showEventListToolbar || topbarPrimaryAction || showBlogReviewButton || showEventReviewButton || showAffiliateAllowCoursesButton">
      <ng-container *ngIf="showAffiliateAllowCoursesButton">
        <button type="button" class="common-topbar__action-btn common-topbar__action-btn--outline" (click)="onAffiliateAllowCoursesClick()">
          <i class="fa fa-check-square-o"></i> Allow course
        </button>
      </ng-container>
      <ng-container *ngIf="showBlogListToolbar">
        <button type="button" class="common-topbar__action-btn common-topbar__action-btn--outline" (click)="onBlogListFilterClick()"><i class="fa fa-filter"></i> Filter</button>
      </ng-container>
      <ng-container *ngIf="showEventListToolbar">
        <button type="button" class="common-topbar__action-btn common-topbar__action-btn--outline" (click)="onEventListFilterClick()"><i class="fa fa-filter"></i> Filter</button>
      </ng-container>
      <ng-container *ngIf="showBlogReviewButton">
        <button type="button" class="common-topbar__action-btn common-topbar__action-btn--outline" (click)="onBlogReviewPanelClick()" title="Open review panel"><i class="fa fa-clipboard"></i> Review</button>
      </ng-container>
      <ng-container *ngIf="showBlogPublishAction">
        <button
          type="button"
          class="common-topbar__action-btn common-topbar__action-btn--success"
          (click)="onBlogPublishClick()"
          [disabled]="blogTopbarBusy"
          title="Publish">
          <i class="fa" [ngClass]="blogTopbarBusy ? 'fa-spinner fa-spin' : 'fa-globe'" aria-hidden="true"></i>
          Publish
        </button>
      </ng-container>
      <ng-container *ngIf="showBlogUnpublishAction">
        <button
          type="button"
          class="common-topbar__action-btn common-topbar__action-btn--pending"
          (click)="onBlogUnpublishClick()"
          [disabled]="blogTopbarBusy"
          title="Unpublish">
          <i class="fa" [ngClass]="blogTopbarBusy ? 'fa-spinner fa-spin' : 'fa-ban'" aria-hidden="true"></i>
          Unpublish
        </button>
      </ng-container>
      <ng-container *ngIf="showBlogDeleteAction">
        <button
          type="button"
          class="common-topbar__action-btn common-topbar__action-btn--danger"
          (click)="onBlogDeleteClick()"
          [disabled]="blogTopbarBusy"
          title="Delete">
          <i class="fa" [ngClass]="blogTopbarBusy ? 'fa-spinner fa-spin' : 'fa-trash'" aria-hidden="true"></i>
          Delete
        </button>
      </ng-container>
      <ng-container *ngIf="showEventReviewButton">
        <button type="button" class="common-topbar__action-btn common-topbar__action-btn--outline" (click)="onEventReviewPanelClick(); $event.stopPropagation()" title="Open review panel" tabindex="0"><i class="fa fa-clipboard"></i> Review</button>
      </ng-container>
      <!-- Approve/Reject for blog are only in the Review sidebar; not duplicated in topbar -->
      <ng-container *ngIf="topbarPrimaryAction && !(topbarPrimaryAction.contentType && isTrainer && isTrainerContext)">
        <a [routerLink]="topbarPrimaryAction.routerLink" class="common-topbar__action-btn common-topbar__action-btn--primary">
          <i class="fa" [ngClass]="topbarPrimaryAction.icon || 'fa-plus'" aria-hidden="true"></i> {{ topbarPrimaryAction.label }}
        </a>
      </ng-container>
      <!-- Trainer Course/Blog/Event: Add button if has permission; Requested badge + message if pending; Request Permission if no request -->
      <ng-container *ngIf="topbarPrimaryAction?.contentType && isTrainer && isTrainerContext">
        <a *ngIf="hasTrainerContentPermission(topbarPrimaryAction.contentType)" [routerLink]="topbarPrimaryAction.routerLink" class="common-topbar__action-btn common-topbar__action-btn--primary">
          <i class="fa" [ngClass]="topbarPrimaryAction.icon || 'fa-plus'" aria-hidden="true"></i> {{ topbarPrimaryAction.label }}
        </a>
        <span *ngIf="!hasTrainerContentPermission(topbarPrimaryAction.contentType) && hasPendingPermissionRequest(topbarPrimaryAction.contentType)" class="common-topbar__permission-pending">
          <span class="common-topbar__permission-badge">Requested</span>
          <span class="common-topbar__permission-message">Permission Requested. Waiting for admin approval.</span>
        </span>
        <button *ngIf="!hasTrainerContentPermission(topbarPrimaryAction.contentType) && !hasPendingPermissionRequest(topbarPrimaryAction.contentType)" type="button" class="common-topbar__action-btn common-topbar__action-btn--outline" [disabled]="trainerRequestingPermission" (click)="onTrainerRequestPermission(topbarPrimaryAction.contentType)">
          {{ trainerRequestingPermission ? 'Sending…' : 'Request Permission' }}
        </button>
      </ng-container>
      <ng-container *ngIf="showTrainerDashboardToolbar">
        <button *ngIf="hasTrainerContentPermission('Course')" type="button" class="common-topbar__action-btn common-topbar__action-btn--primary" (click)="onTrainerAddCourseClick()"><i class="fa fa-plus"></i> Add Course</button>
        <span *ngIf="!hasTrainerContentPermission('Course') && hasPendingPermissionRequest('Course')" class="common-topbar__permission-pending">
          <span class="common-topbar__permission-badge">Requested</span>
          <span class="common-topbar__permission-message">Permission Requested. Waiting for admin approval.</span>
        </span>
        <button *ngIf="!hasTrainerContentPermission('Course') && !hasPendingPermissionRequest('Course')" type="button" class="common-topbar__action-btn common-topbar__action-btn--outline" [disabled]="trainerRequestingPermission" (click)="onTrainerRequestPermission('Course')">
          {{ trainerRequestingPermission ? 'Sending…' : 'Request Permission' }}
        </button>
      </ng-container>
      <ng-container *ngIf="showTrainerListToolbar">
        <div class="common-topbar__course-list-search">
          <input type="text" class="common-topbar__search" placeholder="Search trainers..." [ngModel]="trainerListSearchTerm" (ngModelChange)="onTrainerListSearchChange($event)" (keyup.enter)="onTrainerListSearchTrigger()" />
          <button type="button" class="common-topbar__search-btn" (click)="onTrainerListSearchTrigger()" title="Search"><i class="fa fa-search"></i></button>
        </div>
        <button type="button" class="common-topbar__action-btn common-topbar__action-btn--outline" (click)="onTrainerListFilterClick()"><i class="fa fa-chevron-down"></i> Filters</button>
      </ng-container>
      <ng-container *ngIf="showCourseListToolbar">
        <div class="common-topbar__course-list-search">
          <input type="text" class="common-topbar__search" placeholder="Search courses..." [ngModel]="courseListSearchTerm" (ngModelChange)="onCourseListSearchChange($event)" (keyup.enter)="onCourseListSearchTrigger()" />
          <button type="button" class="common-topbar__search-btn" (click)="onCourseListSearchTrigger()" title="Search"><i class="fa fa-search"></i></button>
        </div>
        <button type="button" class="common-topbar__action-btn common-topbar__action-btn--outline" (click)="onCourseListFilterClick()"><i class="fa fa-filter"></i> Filter</button>
        <button type="button" class="common-topbar__action-btn common-topbar__action-btn--primary" (click)="onCourseListAddCourseClick()"><i class="fa fa-plus"></i> Add Course</button>
      </ng-container>
      <button *ngIf="showAddCategoryButton" type="button" class="common-topbar__action-btn common-topbar__action-btn--outline" (click)="onAddCategoryClick()"><i class="fa fa-plus"></i> ADD CATEGORY</button>
      <button *ngIf="showUserMappingButton" type="button" class="common-topbar__action-btn common-topbar__action-btn--outline" (click)="onUserMappingClick()">USER MAPPING</button>
    </div>
    <div class="common-topbar__user-wrap" [class.common-topbar__user-wrap--open]="dropdownOpen">
    <button type="button" class="common-topbar__user-trigger" (click)="toggleDropdown(); $event.stopPropagation()" [attr.aria-expanded]="dropdownOpen" aria-haspopup="true">
      <span class="common-topbar__user-name">{{ userDisplayName || 'User' }}</span>
      <i class="fa fa-chevron-down common-topbar__user-chevron" aria-hidden="true"></i>
    </button>
    <div class="common-topbar__dropdown-backdrop" *ngIf="dropdownOpen" (click)="closeDropdown()" aria-hidden="true"></div>
    <div class="common-topbar__dropdown" *ngIf="dropdownOpen" (click)="$event.stopPropagation()">
      <div class="common-topbar__dropdown-email" *ngIf="userEmail">{{ userEmail }}</div>
      <a routerLink="/app/profile" class="common-topbar__dropdown-item" (click)="closeDropdown()">
        <i class="fa fa-user"></i> My Profile
      </a>
      <button type="button" class="common-topbar__dropdown-item" (click)="logout()">
        <i class="fa fa-sign-out"></i> Logout
      </button>
    </div>
  </div>
  </div>
</header>
