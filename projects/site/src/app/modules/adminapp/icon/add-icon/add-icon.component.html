<div class="admin-page-wrapper">
    <div class="admin-page-content">
        <div class="admin-card admin-card-centered">
            <div class="admin-card-header">
                <div>
                    <h1 class="admin-card-title">
                        <i class="fas fa-icons"></i>
                        {{pageTitle}}
                    </h1>
                </div>
            </div>
            
            <form [formGroup]="iconForm" (ngSubmit)="onSubmit()" class="admin-form admin-form-full-width">
                <div class="admin-form-group">
                    <label class="admin-form-label required">Name</label>
                    <input type="text" formControlName="name" class="admin-input"
                        [ngClass]="{ 'ng-invalid ng-touched': submitted && f.name.errors }" />
                    <div *ngIf="submitted && f.name.errors" class="invalid-feedback" style="color: #e74c3c; font-size: 0.875rem; margin-top: 0.25rem;">
                        <div *ngIf="f.name.errors.required">Name is required</div>
                    </div>
                </div>
                
                <div class="admin-form-group">
                    <label class="admin-form-label required">Icon Image</label>
                    <input type="file" name="iimage" accept="image/*" (change)="iconFileProgress($event)" 
                        class="admin-input" style="padding: 8px;" />
                </div>
                
                <div class="image-preview" *ngIf="f.url?.value">
                    <img [src]="f.url?.value" height="200" />
                </div>
                
                <div class="admin-form-group" *ngIf="f.url?.value">
                    <label class="admin-form-label">Current Icon URL</label>
                    <div style="padding: 12px; background: #f8f9fa; border-radius: 8px; font-family: monospace; font-size: 0.875rem; word-break: break-all;">
                        {{f.url.value}}
                    </div>
                </div>

                <div class="admin-form-actions">
                    <button class="admin-btn admin-btn-primary" type="submit">
                        <i class="fas fa-save"></i>
                        {{btntext}}
                    </button>
                    <button type="button" class="admin-btn admin-btn-secondary" (click)="goBack()">
                        <i class="fas fa-times"></i>
                        Cancel
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
