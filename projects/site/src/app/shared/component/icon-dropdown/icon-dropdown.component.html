<ng-multiselect-dropdown
  [placeholder]="'Select Icon'"
  [settings]="dropdownIconSettings"
  [data]="iconList"
  [(ngModel)]="modelName"
  [ngModelOptions]="{ standalone: true }"
  (onSelect)="onIconSelect($event)">

  <!-- Template for options in dropdown -->
  <ng-template #optionsTemplate let-item let-option="option" let-id="id" let-isSelected="isSelected">
    <div class="dropdown-option">
      <img
        [src]="getItems?.[id]?.url"
        class="option-icon"
        alt="icon" 
        [attr.aria-label]="(getItems?.[id]?.name ?? '') + ' icon'"/>
      <span class="option-label">
        {{ getItems?.[id]?.name }}
      </span>
    </div>
  </ng-template>

  <!-- Template for selected item -->
  <ng-template #optionSelectedTemplate let-option="option" let-id="id">
    <div class="selected-option">
      <img
        [src]="getItems?.[id]?.url"
        class="selected-icon"
        alt="selected icon"
        [attr.aria-label]="(getItems?.[id]?.name ?? '') + ' selected icon'"/>
      <span class="selected-label">
        {{ getItems?.[id]?.name }}
      </span>
    </div>
  </ng-template>

</ng-multiselect-dropdown>
